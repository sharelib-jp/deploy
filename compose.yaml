name: sharelib

x-auth-image: &auth-image
  image: ${AUTH_IMAGE:-ghcr.io/sharelib-jp/auth-service:latest}
  build:
    context: ../auth-service

services:
  postgres:
    image: docker.io/library/postgres:17-bookworm
    networks: [database]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 prepare.py first}
      AUTH_POSTGRES_DB: ${AUTH_POSTGRES_DB:-auth}
      AUTH_POSTGRES_USER: ${AUTH_POSTGRES_USER:-auth}
      AUTH_POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?Run python3 prepare.py first}
      REPOSITORY_POSTGRES_DB: ${REPOSITORY_POSTGRES_DB:-repository}
      REPOSITORY_POSTGRES_USER: ${REPOSITORY_POSTGRES_USER:-repository}
      REPOSITORY_POSTGRES_PASSWORD: ${REPOSITORY_POSTGRES_PASSWORD:?Run python3 prepare.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/init-databases.sh
        target: /docker-entrypoint-initdb.d/10-sharelib.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # TCP is available after the image has finished running its init scripts.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-keygen:
    <<: *auth-image
    networks: [app]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        umask 077
        if [ ! -s /app/keys/oidc-signing.pem ]; then
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /app/keys/oidc-signing.pem.tmp
          mv /app/keys/oidc-signing.pem.tmp /app/keys/oidc-signing.pem
        fi
    volumes:
      - auth_keys:/app/keys
    restart: "no"

  auth:
    <<: *auth-image
    networks: [app, database]
    volumes:
      - type: bind
        source: ./runtime/auth/config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - auth_keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      auth-keygen:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/.well-known/nodeinfo]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  repository:
    networks: [app, database]
    image: ${REPOSITORY_IMAGE:-ghcr.io/sharelib-jp/repository-service:latest}
    build:
      context: ../repository-service
    volumes:
      - type: bind
        source: ./runtime/repository/config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8081/.well-known/nodeinfo]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  main:
    networks: [app]
    image: ${MAIN_IMAGE:-ghcr.io/sharelib-jp/main-service:latest}
    build:
      context: ../main-service
      target: main
    volumes:
      - type: bind
        source: ./runtime/main/config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - main_catalog:/srv/main
    depends_on:
      repository: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8082/.well-known/nodeinfo]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  gateway:
    image: ${GATEWAY_IMAGE:-sharelib-gateway:local}
    build:
      context: ../main-service
      target: gateway
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set AUTH_DOMAIN in .env}
      REPOSITORY_DOMAIN: ${REPOSITORY_DOMAIN:?Set REPOSITORY_DOMAIN in .env}
      MAIN_DOMAIN: ${MAIN_DOMAIN:?Set MAIN_DOMAIN in .env}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - main_catalog:/srv/main
      - caddy_data:/data
      - caddy_config:/config
    # Public HTTPS names resolve through Cloudflare, including repository -> auth.
    networks: [app]
    depends_on:
      auth: {condition: service_healthy}
      repository: {condition: service_healthy}
      main: {condition: service_healthy}
    restart: unless-stopped

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-docker.io/cloudflare/cloudflared:latest}
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [app]
    depends_on:
      gateway: {condition: service_started}
    restart: unless-stopped

  pgadmin:
    image: ${PGADMIN_IMAGE:-docker.io/dpage/pgadmin4:9.19}
    profiles: [admin]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
      PGADMIN_DISABLE_POSTFIX: 'true'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - '${PGADMIN_BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - type: bind
        source: ./runtime/pgadmin/servers.json
        target: /pgadmin4/servers.json
        read_only: true
        bind:
          create_host_path: false
    networks: [app, database]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

networks:
  # Service-name traffic stays on this bridge; external catalog APIs remain reachable.
  app:
    driver: bridge
  # PostgreSQL has no public ports or external network connection.
  database:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  auth_keys:
  caddy_data:
  caddy_config:
  main_catalog:
  pgadmin_data:
